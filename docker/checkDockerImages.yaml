images:
  - name: library/wordpress
    alertOnPatchDiff: true
    upgradeOnPatchDiff: false
    alertOnDigestDiff: true
    upgradeOnDigestDiff: false
  - name: owncloud/server
    alertOnPatchDiff: true
    upgradeOnPatchDiff: false
  - name: nginx
    alertOnPatchDiff: true
    upgradeOnPatchDiff: true
    alertOnDigestDiff: true
    upgradeOnDigestDiff: true
    upgradeScript: "/path/to/upgrade_nginx.sh -f fromVersionNumber -t toVersionNumber"
  - name: gcr.io/my-project/my-image
    registry: gcr
    alertOnPatchDiff: true
    upgradeOnPatchDiff: false
mailConfigPath: "/path/to/ServerManagement/utils/mail.yaml"
# Tracks the last digest seen per repo:tag for images with no digest of
# their own (e.g. nginx and wordpress above are custom-built FROM these
# base images rather than pulled), so a same-tag rebuild of the base image
# can still be detected across runs. Not needed for images that are pulled
# directly, like owncloud/server.
digestStateFilePath: "/path/to/ServerManagement/docker/digestState.json"
